<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="MI/NUITのカート中身のページです。">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Noto+Serif+JP:wght@200..900&display=swap" 
                rel="stylesheet">
        <!-- Font Awesome -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">       
        <!-- CSS -->
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/cart.css">
        <title>Shopping Cart | MI/NUIT</title>
    </head>
    <body class="cart">
        <header class="l-header l-header--light">
            <div class="l-container">
                <div class="l-header__inner">
                    <!-- Logo -->
                    <h1 class="l-header__logo">
                        <a href="index.html">MI/NUIT</a>
                    </h1>
                    <!-- Navigation -->
                    <button type="button" class="l-header__toggle" aria-controls="header-navigation" aria-expanded="false" aria-label="メニューを開く"><span></span><span></span><span></span></button>
                    <nav class="l-header__nav" id="header-navigation" aria-label="メインナビゲーション">
                        <ul class="l-header__menu">
                            <li class="l-header__item">
                                <a href="brand.html" class="l-header__link">
                                    Brand
                                </a>
                            </li>
                            <li class="l-header__item">
                                <a href="#special-care" class="l-header__link">
                                    Special Care
                                </a>
                            </li>
                            <li class="l-header__item">
                                <a href="contact.html" class="l-header__link">
                                    Contact
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <!-- Button Area -->
                    <div class="l-header__actions">
                        <a href="products.html"class="c-button c-button--primary">
                            SHOP
                        </a>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <section class="c-page-header">
                <div class="l-container">
                    <h1 class="c-page-header__title">
                        Shopping Cart
                    </h1>
                    <p class="c-page-header__subtitle">
                        ショッピングカート
                    </p>
                </div>
            </section>
            <nav class="c-breadcrumb"aria-label="パンくずリスト">
                <div class="l-container">
                    <ol class="c-breadcrumb__list">
                        <li class="c-breadcrumb__item">
                            <a
                                href="index.html"
                                class="c-breadcrumb__link">
                                Home
                            </a>
                        </li>
                        <li class="c-breadcrumb__item">
                            <a href="products.html"
                                class="c-breadcrumb__link">
                                Products
                            </a>
                        </li>
                        <li class="c-breadcrumb__item"aria-current="page">
                            Shopping Cart
                        </li>
                    </ol>
                </div>
            </nav>
            <section class="p-cart">
                <div class="l-container">
                    <div class="p-cart__layout">
                        <div class="p-cart__items">
                            <h2 class="p-cart__title">
                                Cart Items
                            </h2>
                            <div class="p-cart__list">
                                <!-- JSで商品カードを生成 -->
                            </div>
                        </div>
                        <aside class="p-cart__summary">
                            <h2 class="p-cart__summary-title">
                                Order Summary
                            </h2>
                            <dl class="p-cart__summary-list">
                                <div class="p-cart__summary-row">
                                    <dt>商品数</dt>
                                    <dd id="cart-count">
                                        0点
                                    </dd>
                                </div>
                                <div class="p-cart__summary-row">
                                    <dt>小計</dt>
                                    <dd id="cart-subtotal">
                                        ¥0
                                    </dd>
                                </div>
                                <div class="p-cart__summary-row">
                                    <dt>送料</dt>
                                    <dd id="cart-shipping">
                                        ¥550
                                    </dd>
                                </div>
                            </dl>
                            <p
                                class="p-cart__shipping-message"
                                id="cart-shipping-message">
                                5,000円以上のお買い上げで送料無料
                            </p>
                            <dl class="p-cart__summary-list">
                                <div class="p-cart__summary-row
                                            p-cart__summary-row--total">
                                    <dt>合計</dt>
                                    <dd id="cart-total">
                                        ¥0
                                    </dd>
                                </div>
                            </dl>
                            <div class="p-cart__actions">
                                <a href="checkout.html"class="c-button 
                                                    c-button--primary c-button--block">
                                    購入手続きへ進む
                                </a>
                                <a href="shop.html" class="c-button
                                                                c-button--outline c-button--block">
                                    お買い物を続ける
                                </a>
                            </div>
                        </aside>
                    </div>
                </div>
            </section>
        </main>
        <footer>

        </footer>
    </body>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</html>
